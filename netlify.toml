headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

  [functions."*"]

[build]
publish = "/tmp/dao-static-hosting.WVLhdX/frontend/dist"
publishOrigin = "config"
base = "/tmp/dao-static-hosting.WVLhdX"
command = "npm ci --prefix frontend && npm run lint --prefix frontend && npm run test --prefix frontend && npm run build --prefix frontend"
commandOrigin = "config"

  [build.environment]
  NODE_VERSION = "24.15.0"
  VITE_CONTAINER_RUNTIME = "0"
  VITE_DATA_SOURCE = "fixture"
  VITE_API_BASE_URL = ""

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/runtime-config.js"

  [headers.values]
  Cache-Control = "no-cache"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]